<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabián Miliani | Generador de chistes</title>
  <meta name="description" content="Generador de chistes aleatorios usando una API externa." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #111827;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem); }
    p.lead { margin: 0 0 24px; color: #4b5563; }
    .joke {
      min-height: 140px;
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 24px;
      margin: 24px 0;
      border-radius: 16px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 1.15rem;
      line-height: 1.6;
    }
    .setup { font-weight: 600; }
    .delivery { color: #4f46e5; font-weight: 700; }
    button {
      border: 0;
      background: #4f46e5;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .error { color: #dc2626; }
    small { display: block; margin-top: 16px; color: #6b7280; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>😂 Generador de chistes</h1>
    <p class="lead">Pulsa el botón para obtener un chiste aleatorio desde una API externa.</p>

    <div id="joke" class="joke" aria-live="polite">
      <p>Haz clic en <strong>Nuevo chiste</strong> para empezar.</p>
    </div>

    <button id="btn">Nuevo chiste</button>

    <small>Usa <a href="https://v2.jokeapi.dev/" target="_blank" rel="noopener noreferrer">JokeAPI</a>.</small>
  </main>

  <script>
    const API_URL = 'https://v2.jokeapi.dev/joke/Any?safe-mode';
    const jokeEl = document.getElementById('joke');
    const btn = document.getElementById('btn');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadJoke() {
      btn.disabled = true;
      jokeEl.innerHTML = '<p>Cargando...</p>';

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (data.error) throw new Error(data.message || 'Error de API');

        if (data.type === 'twopart') {
          jokeEl.innerHTML = `
            <p class="setup">${escapeHtml(data.setup)}</p>
            <p class="delivery">${escapeHtml(data.delivery)}</p>
          `;
        } else {
          jokeEl.innerHTML = `<p>${escapeHtml(data.joke)}</p>`;
        }
      } catch (error) {
        console.error(error);
        jokeEl.innerHTML = '<p class="error">No se pudo cargar el chiste. Inténtalo de nuevo.</p>';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', loadJoke);
    loadJoke();
  </script>
</body>
</html>
